<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>لوحة التحكم - Nova RP</title>
  <link rel="icon" type="image/png" href="assets/logo.png">
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;900&display=swap" rel="stylesheet">
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
  <style>
    :root {
      color-scheme: dark;
      --bg: #0c1017;
      --surface: #111827;
      --surface2: #161b27;
      --surface3: #1c2235;
      --surface4: #232a3e;
      --text: #f4f6fb;
      --muted: #9aa6c1;
      --border: #27304c;
      --accent: #e2b336;
      --accent2: #f8d26e;
      --accent-dim: rgba(226,179,54,0.12);
      --accent-glow: rgba(226,179,54,0.25);
      --danger: #e25050;
      --danger-dim: rgba(226,80,80,0.12);
      --success: #3ecf8e;
      --success-dim: rgba(62,207,142,0.12);
      --info: #6c8cff;
      --info-dim: rgba(108,140,255,0.12);
      --warn: #f0a040;
      --warn-dim: rgba(240,160,64,0.12);
      --sidebar-w: 270px;
      --sidebar-collapsed: 72px;
      --topbar-h: 64px;
      --radius: 14px;
      --radius-sm: 10px;
      --shadow: 0 8px 32px rgba(0,0,0,0.4);
      --glass: rgba(17,24,39,0.7);
      --glass-border: rgba(255,255,255,0.08);
    }
    .light-mode {
      --bg: #f0f2f5;
      --surface: #ffffff;
      --surface2: #f7f8fa;
      --surface3: #eef0f4;
      --surface4: #e4e7ed;
      --text: #1a1d26;
      --muted: #6b7280;
      --border: #d1d5db;
      --glass: rgba(255,255,255,0.85);
      --glass-border: rgba(0,0,0,0.08);
      --shadow: 0 8px 32px rgba(0,0,0,0.08);
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body {
      background: var(--bg);
      font-family: 'Cairo', 'Segoe UI', Tahoma, Arial, sans-serif;
      color: var(--text);
      min-height: 100vh;
      overflow: hidden;
    }
    a { color: inherit; text-decoration: none; }
    ::-webkit-scrollbar { width: 5px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: var(--border); border-radius: 3px; }

    /* ── Starfield Canvas ── */
    #starfield {
      position: fixed; inset: 0; z-index: 0; pointer-events: none;
    }

    /* ── Admin Wrapper ── */
    .admin-wrapper {
      position: relative; z-index: 1;
      display: flex; height: 100vh;
    }

    /* ── Sidebar ── */
    .sidebar {
      width: var(--sidebar-w); min-width: var(--sidebar-w);
      background: var(--glass); backdrop-filter: blur(20px);
      border-left: 1px solid var(--glass-border);
      display: flex; flex-direction: column;
      transition: width .3s cubic-bezier(.4,0,.2,1), min-width .3s cubic-bezier(.4,0,.2,1);
      overflow: hidden; position: relative; z-index: 10;
    }
    .sidebar.collapsed {
      width: var(--sidebar-collapsed); min-width: var(--sidebar-collapsed);
    }
    .sidebar-brand {
      display: flex; align-items: center; gap: 12px;
      padding: 20px 18px; border-bottom: 1px solid var(--glass-border);
      white-space: nowrap; overflow: hidden;
    }
    .sidebar-brand img {
      width: 38px; height: 38px; border-radius: 50%; object-fit: cover;
      border: 2px solid var(--accent); box-shadow: 0 0 16px rgba(226,179,54,0.3);
      flex-shrink: 0;
    }
    .sidebar-brand span {
      font-size: 16px; font-weight: 900; letter-spacing: .05em;
      background: linear-gradient(135deg, var(--accent), var(--accent2));
      -webkit-background-clip: text; -webkit-text-fill-color: transparent;
      transition: opacity .2s;
    }
    .sidebar.collapsed .sidebar-brand span { opacity: 0; }

    .sidebar-toggle {
      display: flex; align-items: center; justify-content: center;
      padding: 10px; cursor: pointer; color: var(--muted);
      transition: color .2s, background .2s; border-bottom: 1px solid var(--glass-border);
    }
    .sidebar-toggle:hover { color: var(--accent); background: var(--accent-dim); }
    .sidebar-toggle i { font-size: 16px; transition: transform .3s; }
    .sidebar.collapsed .sidebar-toggle i { transform: rotate(180deg); }

    .sidebar-nav {
      flex: 1; overflow-y: auto; padding: 12px 0;
    }
    .nav-group { margin-bottom: 4px; }
    .nav-group-title {
      display: flex; align-items: center; gap: 10px;
      padding: 10px 18px; font-size: 12px; font-weight: 700;
      color: var(--muted); text-transform: uppercase; letter-spacing: .08em;
      cursor: pointer; transition: color .2s; white-space: nowrap; overflow: hidden;
    }
    .nav-group-title i { font-size: 11px; transition: transform .3s; flex-shrink: 0; width: 16px; text-align: center; }
    .nav-group-title i.fa-chevron-down { margin-right: auto; margin-left: 0; font-size: 9px; }
    .nav-group.open .nav-group-title i.fa-chevron-down { transform: rotate(180deg); }
    .sidebar.collapsed .nav-group-title span,
    .sidebar.collapsed .nav-group-title i.fa-chevron-down { opacity: 0; }

    .nav-group-items { overflow: hidden; max-height: 0; transition: max-height .35s ease; }
    .nav-group.open .nav-group-items { max-height: 500px; }

    .nav-item {
      display: flex; align-items: center; gap: 10px;
      padding: 9px 18px 9px 28px; font-size: 13px; font-weight: 600;
      color: var(--muted); cursor: pointer; transition: all .2s;
      white-space: nowrap; overflow: hidden; position: relative;
    }
    .nav-item:hover { color: var(--text); background: rgba(255,255,255,0.04); }
    .nav-item.active {
      color: var(--accent); background: var(--accent-dim);
    }
    .nav-item.active::before {
      content: ''; position: absolute; right: 0; top: 50%; transform: translateY(-50%);
      width: 3px; height: 60%; border-radius: 3px; background: var(--accent);
    }
    .nav-item i { width: 18px; text-align: center; font-size: 13px; flex-shrink: 0; }
    .sidebar.collapsed .nav-item span { opacity: 0; }
    .sidebar.collapsed .nav-item { padding: 12px 0; justify-content: center; }

    /* Tooltip for collapsed sidebar */
    .sidebar.collapsed .nav-item:hover::after,
    .sidebar.collapsed .nav-group-title:hover::after {
      content: attr(data-tip);
      position: absolute; right: calc(100% + 8px); top: 50%; transform: translateY(-50%);
      background: var(--surface3); color: var(--text); padding: 4px 10px;
      border-radius: 6px; font-size: 12px; white-space: nowrap; z-index: 100;
      border: 1px solid var(--border); box-shadow: var(--shadow);
    }

    .sidebar-footer {
      padding: 14px 18px; border-top: 1px solid var(--glass-border);
      display: flex; align-items: center; gap: 10px;
      white-space: nowrap; overflow: hidden;
    }
    .sidebar-footer .avatar {
      width: 34px; height: 34px; border-radius: 50%; background: var(--accent-dim);
      display: flex; align-items: center; justify-content: center;
      color: var(--accent); font-weight: 800; font-size: 14px; flex-shrink: 0;
    }
    .sidebar-footer .user-info { overflow: hidden; }
    .sidebar-footer .user-name { font-size: 13px; font-weight: 700; }
    .sidebar-footer .user-role { font-size: 11px; color: var(--muted); }
    .sidebar.collapsed .sidebar-footer .user-info { opacity: 0; }

    /* ── Main Area ── */
    .main-area {
      flex: 1; display: flex; flex-direction: column; overflow: hidden;
    }

    /* ── Top Bar ── */
    .topbar {
      height: var(--topbar-h); display: flex; align-items: center; gap: 12px;
      padding: 0 24px; background: var(--glass); backdrop-filter: blur(20px);
      border-bottom: 1px solid var(--glass-border); flex-shrink: 0;
    }
    .topbar-search {
      position: relative; flex: 1; max-width: 420px;
    }
    .topbar-search input {
      width: 100%; padding: 9px 16px 9px 38px; background: var(--surface2);
      border: 1px solid var(--border); border-radius: 10px; color: var(--text);
      font-family: 'Cairo', sans-serif; font-size: 13px; outline: none;
      transition: border-color .2s, box-shadow .2s;
    }
    .topbar-search input:focus { border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-dim); }
    .topbar-search input::placeholder { color: var(--muted); }
    .topbar-search i {
      position: absolute; left: 13px; top: 50%; transform: translateY(-50%);
      color: var(--muted); font-size: 13px;
    }
    .topbar-actions { display: flex; align-items: center; gap: 8px; margin-right: auto; }
    .topbar-btn {
      position: relative; width: 38px; height: 38px; border-radius: 10px;
      background: var(--surface2); border: 1px solid var(--border);
      color: var(--muted); cursor: pointer; display: flex;
      align-items: center; justify-content: center;
      transition: all .2s; font-size: 15px;
    }
    .topbar-btn:hover { color: var(--text); background: var(--surface3); }
    .topbar-badge {
      position: absolute; top: -3px; left: -3px;
      width: 16px; height: 16px; border-radius: 50%;
      background: var(--danger); color: #fff; font-size: 9px;
      display: flex; align-items: center; justify-content: center;
      font-weight: 800;
    }
    .quick-add-btn {
      display: flex; align-items: center; gap: 6px;
      padding: 8px 16px; border-radius: 10px; border: none;
      background: linear-gradient(135deg, var(--accent), var(--accent2));
      color: #000; font-family: 'Cairo', sans-serif; font-size: 13px;
      font-weight: 800; cursor: pointer; transition: all .2s;
      white-space: nowrap; position: relative;
    }
    .quick-add-btn:hover { transform: translateY(-1px); box-shadow: 0 4px 16px rgba(226,179,54,0.4); }
    .quick-add-dropdown {
      position: absolute; top: calc(100% + 8px); right: 0;
      background: var(--surface); border: 1px solid var(--border);
      border-radius: var(--radius-sm); min-width: 200px;
      box-shadow: var(--shadow); z-index: 100; display: none;
      overflow: hidden;
    }
    .quick-add-dropdown.show { display: block; }
    .quick-add-dropdown a {
      display: flex; align-items: center; gap: 8px;
      padding: 10px 16px; font-size: 13px; font-weight: 600;
      color: var(--muted); transition: all .2s; cursor: pointer;
    }
    .quick-add-dropdown a:hover { background: var(--accent-dim); color: var(--accent); }
    .quick-add-dropdown a i { width: 18px; text-align: center; }

    /* ── Notification Dropdown ── */
    .notif-dropdown {
      position: absolute; top: calc(100% + 8px); left: 0;
      width: 340px; background: var(--surface); border: 1px solid var(--border);
      border-radius: var(--radius); box-shadow: var(--shadow); z-index: 100;
      display: none; overflow: hidden;
    }
    .notif-dropdown.show { display: block; }
    .notif-dropdown-header { padding: 14px 16px; border-bottom: 1px solid var(--border); font-weight: 700; font-size: 14px; }
    .notif-dropdown-body { max-height: 300px; overflow-y: auto; }
    .notif-item {
      display: flex; gap: 10px; padding: 12px 16px;
      border-bottom: 1px solid var(--glass-border); transition: background .2s; cursor: pointer;
    }
    .notif-item:hover { background: var(--accent-dim); }
    .notif-item .notif-icon {
      width: 34px; height: 34px; border-radius: 50%; display: flex;
      align-items: center; justify-content: center; font-size: 14px; flex-shrink: 0;
    }
    .notif-item .notif-text { font-size: 12px; color: var(--muted); line-height: 1.5; }
    .notif-item .notif-text strong { color: var(--text); }

    /* ── Content Area ── */
    .content-area {
      flex: 1; overflow-y: auto; padding: 24px;
    }
    .page-header {
      display: flex; align-items: center; justify-content: space-between;
      margin-bottom: 24px; gap: 16px; flex-wrap: wrap;
    }
    .page-title {
      font-size: 24px; font-weight: 900;
    }
    .page-title small {
      font-size: 14px; font-weight: 600; color: var(--muted); margin-right: 10px;
    }

    /* ── Stat Cards ── */
    .stats-grid {
      display: grid; grid-template-columns: repeat(auto-fill, minmax(230px, 1fr));
      gap: 16px; margin-bottom: 24px;
    }
    .stat-card {
      background: var(--glass); backdrop-filter: blur(16px);
      border: 1px solid var(--glass-border); border-radius: var(--radius);
      padding: 20px; transition: transform .2s, box-shadow .2s;
    }
    .stat-card:hover { transform: translateY(-3px); box-shadow: 0 12px 40px rgba(0,0,0,0.3); }
    .stat-card-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 12px; }
    .stat-card-icon {
      width: 42px; height: 42px; border-radius: 12px;
      display: flex; align-items: center; justify-content: center;
      font-size: 18px;
    }
    .stat-card-trend {
      font-size: 12px; font-weight: 700; display: flex; align-items: center; gap: 4px;
    }
    .stat-card-trend.up { color: var(--success); }
    .stat-card-trend.down { color: var(--danger); }
    .stat-card-value { font-size: 28px; font-weight: 900; margin-bottom: 4px; }
    .stat-card-label { font-size: 13px; color: var(--muted); font-weight: 600; }

    /* ── Charts ── */
    .charts-grid {
      display: grid; grid-template-columns: repeat(auto-fill, minmax(400px, 1fr));
      gap: 20px; margin-bottom: 24px;
    }
    .chart-card {
      background: var(--glass); backdrop-filter: blur(16px);
      border: 1px solid var(--glass-border); border-radius: var(--radius);
      padding: 20px;
    }
    .chart-card h3 {
      font-size: 15px; font-weight: 700; margin-bottom: 16px;
      display: flex; align-items: center; gap: 8px;
    }
    .chart-card h3 i { color: var(--accent); font-size: 14px; }
    .chart-wrap { position: relative; height: 280px; }
    .chart-wrap canvas { width: 100% !important; height: 100% !important; }

    /* ── Data Table ── */
    .data-card {
      background: var(--glass); backdrop-filter: blur(16px);
      border: 1px solid var(--glass-border); border-radius: var(--radius);
      overflow: hidden;
    }
    .data-card-header {
      display: flex; align-items: center; justify-content: space-between;
      padding: 16px 20px; border-bottom: 1px solid var(--glass-border); gap: 12px; flex-wrap: wrap;
    }
    .data-card-header h3 { font-size: 15px; font-weight: 700; }
    .data-card-actions { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
    .data-card-actions .filter-select,
    .data-card-actions .search-sm {
      padding: 7px 12px; background: var(--surface2); border: 1px solid var(--border);
      border-radius: 8px; color: var(--text); font-family: 'Cairo', sans-serif;
      font-size: 12px; outline: none;
    }
    .data-card-actions .search-sm { padding-left: 32px; position: relative; }

    .data-table-wrap { overflow-x: auto; }
    .data-table {
      width: 100%; border-collapse: collapse; font-size: 13px;
    }
    .data-table th {
      padding: 12px 16px; text-align: right; font-weight: 700;
      color: var(--muted); font-size: 12px; text-transform: uppercase;
      letter-spacing: .04em; border-bottom: 1px solid var(--glass-border);
      background: var(--surface2); white-space: nowrap;
    }
    .data-table td {
      padding: 12px 16px; border-bottom: 1px solid var(--glass-border);
      white-space: nowrap;
    }
    .data-table tr:hover td { background: rgba(255,255,255,0.02); }
    .data-table .actions { display: flex; gap: 6px; }
    .data-table .actions button {
      width: 30px; height: 30px; border-radius: 8px; border: 1px solid var(--border);
      background: var(--surface2); color: var(--muted); cursor: pointer;
      display: flex; align-items: center; justify-content: center;
      font-size: 12px; transition: all .2s;
    }
    .data-table .actions button:hover { color: var(--text); background: var(--surface3); }
    .data-table .actions button.danger:hover { color: var(--danger); background: var(--danger-dim); }

    /* ── Status Badges ── */
    .badge-status {
      display: inline-flex; align-items: center; gap: 4px;
      padding: 4px 10px; border-radius: 999px; font-size: 11px; font-weight: 700;
    }
    .badge-new { background: var(--info-dim); color: var(--info); }
    .badge-pending { background: var(--warn-dim); color: var(--warn); }
    .badge-review { background: rgba(168,85,247,0.12); color: #a855f7; }
    .badge-paid { background: var(--success-dim); color: var(--success); }
    .badge-completed { background: var(--success-dim); color: var(--success); }
    .badge-cancelled { background: var(--danger-dim); color: var(--danger); }
    .badge-refunded { background: rgba(156,163,175,0.12); color: #9ca3af; }
    .badge-active { background: var(--success-dim); color: var(--success); }
    .badge-inactive { background: var(--danger-dim); color: var(--danger); }
    .badge-expired { background: rgba(156,163,175,0.12); color: #9ca3af; }

    /* ── Buttons ── */
    .btn {
      display: inline-flex; align-items: center; gap: 6px;
      padding: 8px 16px; border-radius: var(--radius-sm); border: 1px solid var(--border);
      background: var(--surface2); color: var(--text); font-family: 'Cairo', sans-serif;
      font-size: 13px; font-weight: 700; cursor: pointer; transition: all .2s;
      white-space: nowrap;
    }
    .btn:hover { background: var(--surface3); }
    .btn-primary {
      background: linear-gradient(135deg, var(--accent), var(--accent2));
      color: #000; border-color: transparent;
    }
    .btn-primary:hover { box-shadow: 0 4px 16px rgba(226,179,54,0.4); transform: translateY(-1px); }
    .btn-danger { background: var(--danger-dim); color: var(--danger); border-color: rgba(226,80,80,0.2); }
    .btn-danger:hover { background: rgba(226,80,80,0.2); }
    .btn-success { background: var(--success-dim); color: var(--success); border-color: rgba(62,207,142,0.2); }
    .btn-sm { padding: 5px 10px; font-size: 12px; }

    /* ── Modal ── */
    .modal-overlay {
      position: fixed; inset: 0; background: rgba(0,0,0,0.65);
      backdrop-filter: blur(6px); z-index: 1000;
      display: flex; align-items: center; justify-content: center;
      opacity: 0; pointer-events: none; transition: opacity .3s;
    }
    .modal-overlay.open { opacity: 1; pointer-events: all; }
    .modal-box {
      background: var(--surface); border: 1px solid var(--glass-border);
      border-radius: 20px; width: min(620px, 94vw); max-height: 90vh;
      overflow-y: auto; box-shadow: 0 40px 80px rgba(0,0,0,0.6);
      transform: scale(.92) translateY(20px);
      transition: transform .35s cubic-bezier(.32,.74,.48,1);
      padding: 28px;
    }
    .modal-overlay.open .modal-box { transform: scale(1) translateY(0); }
    .modal-header {
      display: flex; align-items: center; justify-content: space-between;
      margin-bottom: 20px;
    }
    .modal-header h2 { font-size: 18px; font-weight: 800; }
    .modal-close {
      width: 34px; height: 34px; border-radius: 50%;
      background: var(--surface2); border: 1px solid var(--border);
      color: var(--muted); cursor: pointer; display: flex;
      align-items: center; justify-content: center;
      transition: all .2s;
    }
    .modal-close:hover { color: var(--text); background: var(--surface3); }
    .form-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
    .form-grid .full { grid-column: 1 / -1; }
    .form-group { margin-bottom: 14px; }
    .form-group label {
      display: block; font-size: 12px; font-weight: 700;
      color: var(--muted); margin-bottom: 6px;
    }
    .form-group input, .form-group select, .form-group textarea {
      width: 100%; padding: 10px 14px; background: var(--surface2);
      border: 1px solid var(--border); border-radius: var(--radius-sm);
      color: var(--text); font-family: 'Cairo', sans-serif;
      font-size: 13px; outline: none; transition: border-color .2s;
    }
    .form-group input:focus, .form-group select:focus, .form-group textarea:focus {
      border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-dim);
    }
    .form-group textarea { resize: vertical; min-height: 80px; }
    .form-group select { cursor: pointer; }
    .form-group input::placeholder, .form-group textarea::placeholder { color: var(--muted); }
    .modal-footer { display: flex; gap: 10px; justify-content: flex-start; margin-top: 16px; }

    /* ── Tabs ── */
    .tabs-bar {
      display: flex; gap: 4px; background: var(--surface2);
      border-radius: var(--radius-sm); padding: 4px; margin-bottom: 16px;
    }
    .tab-btn {
      padding: 8px 16px; border-radius: 8px; border: none;
      background: none; color: var(--muted); font-family: 'Cairo', sans-serif;
      font-size: 13px; font-weight: 700; cursor: pointer; transition: all .2s;
    }
    .tab-btn.active { background: var(--surface3); color: var(--text); }
    .tab-btn:hover { color: var(--text); }

    /* ── Toast ── */
    .toast-container {
      position: fixed; top: 20px; left: 50%; transform: translateX(-50%);
      z-index: 100000; display: flex; flex-direction: column; align-items: center; gap: 8px;
      pointer-events: none;
    }
    .toast {
      background: var(--surface3); border: 1px solid var(--border);
      border-radius: 10px; padding: 10px 18px; font-size: 13px; font-weight: 600;
      color: var(--text); box-shadow: 0 10px 30px rgba(0,0,0,0.5);
      display: flex; align-items: center; gap: 8px;
      animation: toastIn .3s ease; pointer-events: all;
    }
    .toast.success { border-color: rgba(62,207,142,0.3); }
    .toast.success i { color: var(--success); }
    .toast.warn { border-color: rgba(240,160,64,0.3); }
    .toast.warn i { color: var(--warn); }
    .toast.error { border-color: rgba(226,80,80,0.3); }
    .toast.error i { color: var(--danger); }
    @keyframes toastIn { from { opacity:0; transform:translateY(-12px) scale(.95); } to { opacity:1; transform:translateY(0) scale(1); } }

// ═══════════════════════════════════════════════════════════════════════════════
// STARFIELD ANIMATION
// ═══════════════════════════════════════════════════════════════════════════════
(function(){
  const canvas = document.getElementById('starfield');
  const ctx = canvas.getContext('2d');
  let W, H, stars = [], meteors = [], particles = [];

  function resize() { W = canvas.width = window.innerWidth; H = canvas.height = window.innerHeight; }
  window.addEventListener('resize', resize); resize();

  for (let i = 0; i < 220; i++) stars.push({
    x: Math.random()*W, y: Math.random()*H,
    r: Math.random()*1.5+.3, a: Math.random(), s: Math.random()*.0015+.0005,
    p: Math.random()*Math.PI*2
  });

  function spawnMeteor() {
    if (meteors.length < 2 && Math.random() < .006) meteors.push({
      x: Math.random()*W*.8, y: -10,
      len: Math.random()*80+60, speed: Math.random()*4+3,
      a: 1
    });
  }
  function spawnParticle() {
    if (particles.length < 15 && Math.random() < .02) particles.push({
      x: Math.random()*W, y: Math.random()*H,
      r: Math.random()*2+1, a: Math.random()*.4+.1,
      vx: (Math.random()-.5)*.3, vy: (Math.random()-.5)*.3,
      life: Math.random()*200+100
    });
  }

  function draw() {
    ctx.clearRect(0,0,W,H);
    // Stars
    stars.forEach(s => {
      s.p += s.s;
      const alpha = .3 + .7 * Math.abs(Math.sin(s.p));
      ctx.beginPath(); ctx.arc(s.x, s.y, s.r, 0, Math.PI*2);
      ctx.fillStyle = `rgba(244,246,251,${alpha})`; ctx.fill();
    });
    // Meteors
    spawnMeteor();
    meteors.forEach((m,i) => {
      m.x += m.speed; m.y += m.speed;
      m.a -= .008;
      const grad = ctx.createLinearGradient(m.x, m.y, m.x - m.len*.7, m.y - m.len*.7);
      grad.addColorStop(0, `rgba(226,179,54,${m.a})`);
      grad.addColorStop(1, 'rgba(226,179,54,0)');
      ctx.beginPath(); ctx.moveTo(m.x, m.y);
      ctx.lineTo(m.x - m.len*.7, m.y - m.len*.7);
      ctx.strokeStyle = grad; ctx.lineWidth = 1.5; ctx.stroke();
      if (m.a <= 0 || m.y > H) meteors.splice(i,1);
    });
    // Gold particles
    spawnParticle();
    particles.forEach((p,i) => {
      p.x += p.vx; p.y += p.vy; p.life--; p.a *= .995;
      ctx.beginPath(); ctx.arc(p.x, p.y, p.r, 0, Math.PI*2);
      ctx.fillStyle = `rgba(226,179,54,${p.a})`; ctx.fill();
      if (p.life <= 0) particles.splice(i,1);
    });
    requestAnimationFrame(draw);
  }
  draw();
})();

function handleGlobalSearch(q) {
  // Simple: navigate to relevant page with query
  if (!q.trim()) return;
  const ql = q.trim().toLowerCase();
  // Check products
  if (products.find(p => p.name.toLowerCase().includes(ql))) { navigateTo('products'); return; }
  if (orders.find(o => o.id.toLowerCase().includes(ql) || o.customer.toLowerCase().includes(ql))) { navigateTo('orders'); return; }
  if (customers.find(c => c.name.toLowerCase().includes(ql) || c.email.toLowerCase().includes(ql))) { navigateTo('customers'); return; }
}

function fmt(n) { return Number(n).toLocaleString('ar-EG'); }
function statusBadge(s) {
  const map = {'جديد':'new','بانتظار الدفع':'pending','قيد المراجعة':'review','مدفوع':'paid','مكتمل':'completed','ملغي':'cancelled','مسترجع':'refunded','active':'active','inactive':'inactive','expired':'expired'};
  const cls = map[s] || 'new';
  return `<span class="badge-status badge-${cls}">${s}</span>`;
}
let nextId = (arr) => (arr.length ? Math.max(...arr.map(i=>i.id))+1 : 1);

      <div class="form-group"><label>التصنيف</label><select id="pCategory">${CATEGORIES.map(c=>`<option ${p&&p.category===c?'selected':''}>${c}</option>`).join('')}</select></div>

      <div class="form-group full"><label>وصف مختصر</label><textarea id="pDesc">${p?p.desc:''}</textarea></div>
    </div>
    <div class="modal-footer">
      <button class="btn btn-primary" onclick="saveProduct(${id||0})"><i class="fas fa-check"></i> حفظ</button>
      <button class="btn" onclick="closeModal()">إلغاء</button>
    </div>
  `);

function saveProduct(id) {
  const data = {
    name: document.getElementById('pName').value.trim(),
    price: Number(document.getElementById('pPrice').value) || 0,
    oldPrice: Number(document.getElementById('pOldPrice').value) || 0,
    category: document.getElementById('pCategory').value,
    status: document.getElementById('pStatus').value,
    stock: Number(document.getElementById('pStock').value) || 0,
    sku: document.getElementById('pSku').value.trim(),
    img: document.getElementById('pImg').value.trim(),
    tags: document.getElementById('pTags').value.trim(),
    desc: document.getElementById('pDesc').value.trim(),
  };
  if (!data.name) { toast('يرجى إدخال اسم المنتج','warn'); return; }
  if (id) {
    const p = products.find(x=>x.id===id);
    Object.assign(p, data);
    toast('تم تعديل المنتج بنجاح');
  } else {
    data.id = nextId(products);
    products.push(data);
    toast('تمت إضافة المنتج بنجاح');
  }
  persist('products'); closeModal(); renderProducts();
  addLog(id?'تعديل منتج':'إضافة منتج', data.name);
}

function duplicateProduct(id) {
  const p = products.find(x=>x.id===id);
  if (!p) return;
  const dup = {...p, id: nextId(products), name: p.name + ' (نسخة)', sku: p.sku + '-COPY' };
  products.push(dup); persist('products'); renderProducts();
  toast('تم نسخ المنتج'); addLog('نسخ منتج', p.name);
}

function toggleProductStatus(id) {
  const p = products.find(x=>x.id===id);
  p.status = p.status === 'active' ? 'inactive' : 'active';
  persist('products'); renderProducts();
  toast(p.status==='active'?'تم تفعيل المنتج':'تم إيقاف المنتج');

function saveCustomer(id) {
  const data = { name:document.getElementById('cName').value.trim(), email:document.getElementById('cEmail').value.trim(), phone:document.getElementById('cPhone').value.trim() };

function toggleCustomerStatus(id) {
  const c = customers.find(x=>x.id===id);
  c.status = c.status==='active'?'blocked':'active';

function deleteCustomer(id) {

  toast('تم حذف العميل','warn');
}

  const isDark = !document.body.classList.contains('light-mode');
  const gc = isDark?'rgba(255,255,255,0.06)':'rgba(0,0,0,0.06)';

  const months = ['يناير','فبراير','مارس','أبريل','مايو','يونيو','يوليو','أغسطس','سبتمبر','أكتوبر','نوفمبر','ديسمبر'];

  const colors = {sales:'#e2b336',profit:'#3ecf8e',visits:'#6c8cff'};

  chartInstances.push(new Chart(document.getElementById('reportChart'),{type:'line',data:{labels:months,datasets:[{label:titles[type],data:datas[type],borderColor:colors[type],backgroundColor:colors[type]+'22',fill:true,tension:.4}]},options:{responsive:true,maintainAspectRatio:false,scales:{x:{ticks:{color:tc},grid:{color:gc}},y:{ticks:{color:tc},grid:{color:gc}}}}}));
}

function saveSiteSettings() {
  siteSettings.siteName=document.getElementById('sName').value.trim();
  siteSettings.logo=document.getElementById('sLogo').value.trim();
  siteSettings.metaTitle=document.getElementById('sMetaTitle').value.trim();
  siteSettings.metaDesc=document.getElementById('sMetaDesc').value.trim();
  siteSettings.accentColor=document.getElementById('sAccent').value;
  siteSettings.maintenanceMode=document.getElementById('sMaint').value==='true';
  persist('settings'); toast('تم حفظ الإعدادات'); addLog('تحديث إعدادات','إعدادات الموقع');
}

function renderPaymentSettings() {
  document.getElementById('contentArea').innerHTML = `
    <div class="page-header"><h1 class="page-title">إعدادات الدفع</h1></div>
    <div class="data-card" style="padding:24px">
      <h3 style="margin-bottom:16px">طرق الدفع المفعّلة</h3>
      <div style="display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:10px">
        ${PAYMENT_METHODS.map(m=>`<label style="display:flex;align-items:center;gap:8px;padding:10px;background:var(--surface2);border:1px solid var(--border);border-radius:10px;cursor:pointer">
          <input type="checkbox" ${siteSettings.paymentMethods.includes(m)?'checked':''} onchange="togglePaymentMethod('${m}',this.checked)"> ${m}
        </label>`).join('')}
      </div>
    </div>`;
}
function togglePaymentMethod(m, checked) {
  if (checked && !siteSettings.paymentMethods.includes(m)) siteSettings.paymentMethods.push(m);
  if (!checked) siteSettings.paymentMethods = siteSettings.paymentMethods.filter(x=>x!==m);
  persist('settings'); toast('تم تحديث طرق الدفع');
}

function renderDiscordSettings() {
  document.getElementById('contentArea').innerHTML = `
    <div class="page-header"><h1 class="page-title">إعدادات Discord</h1></div>
    <div class="data-card" style="padding:24px">
      <div class="form-grid">
        <div class="form-group"><label>Discord Client ID</label><input id="dClientId" value="${siteSettings.discordClientId}" placeholder="رقم التطبيق"></div>
        <div class="form-group"><label>Webhook URL</label><input id="dWebhook" value="${siteSettings.discordWebhook}" placeholder="https://discord.com/api/webhooks/..."></div>
        <div class="form-group"><label>Logs Channel ID</label><input id="dLogs" value="${siteSettings.discordLogsChannel}" placeholder="رقم القناة"></div>
      </div>
      <div style="margin-top:16px"><button class="btn btn-primary" onclick="saveDiscordSettings()"><i class="fas fa-check"></i> حفظ</button></div>
    </div>`;
}
function saveDiscordSettings() {
  siteSettings.discordClientId=document.getElementById('dClientId').value.trim();
  siteSettings.discordWebhook=document.getElementById('dWebhook').value.trim();
  siteSettings.discordLogsChannel=document.getElementById('dLogs').value.trim();
  persist('settings'); toast('تم حفظ إعدادات Discord'); addLog('تحديث إعدادات','Discord');
}

      <div class="form-grid">
        <div class="form-group full"><label>عنوان الصفحة الرئيسية</label><input id="seoTitle" value="${siteSettings.metaTitle}"></div>

// ── ADMINS ────────────────────────────────────────────────────────────────────
function renderAdmins() {
  const area = document.getElementById('contentArea');
  area.innerHTML = `
    <div class="page-header">
      <h1 class="page-title">إدارة المشرفين</h1>
      <button class="btn btn-primary" onclick="openAdminModal()"><i class="fas fa-plus"></i> إضافة مشرف</button>
    </div>
    <div class="data-card"><div class="data-table-wrap"><table class="data-table">
      <thead><tr><th>#</th><th>الاسم</th><th>البريد</th><th>الدور</th><th>آخر دخول</th><th>الحالة</th><th>إجراءات</th></tr></thead>
      <tbody>${admins.map(a=>`<tr>
        <td>${a.id}</td><td><strong>${a.name}</strong></td><td>${a.email}</td>
        <td><span class="badge-status ${a.role==='Super Admin'?'badge-paid':a.role==='Admin'?'badge-new':'badge-pending'}">${a.role}</span></td>
        <td>${a.lastLogin}</td><td>${statusBadge(a.status)}</td>
        <td class="actions">
          <button onclick="openAdminModal(${a.id})" title="تعديل"><i class="fas fa-pen"></i></button>
          <button class="danger" onclick="deleteAdmin(${a.id})" title="حذف"><i class="fas fa-trash"></i></button>
        </td>
      </tr>`).join('')}</tbody>
    </table></div></div>`;
}

function openAdminModal(id) {
  const a = id ? admins.find(x=>x.id===id) : null;
  openModal(`
    <div class="modal-header"><h2>${a?'تعديل مشرف':'إضافة مشرف'}</h2><button class="modal-close" onclick="closeModal()"><i class="fas fa-times"></i></button></div>
    <div class="form-grid">
      <div class="form-group"><label>الاسم</label><input id="aName" value="${a?a.name:''}"></div>
      <div class="form-group"><label>البريد</label><input id="aEmail" value="${a?a.email:''}"></div>
      <div class="form-group"><label>الدور</label><select id="aRole"><option ${a&&a.role==='Super Admin'?'selected':''}>Super Admin</option><option ${a&&a.role==='Admin'?'selected':''}>Admin</option><option ${a&&a.role==='Moderator'?'selected':''}>Moderator</option><option ${a&&a.role==='Support'?'selected':''}>Support</option></select></div>
    </div>
    <div class="modal-footer"><button class="btn btn-primary" onclick="saveAdmin(${id||0})"><i class="fas fa-check"></i> حفظ</button><button class="btn" onclick="closeModal()">إلغاء</button></div>
  `);
}
function saveAdmin(id) {
  const data = { name:document.getElementById('aName').value.trim(), email:document.getElementById('aEmail').value.trim(), role:document.getElementById('aRole').value };
  if (!data.name) { toast('يرجى إدخال الاسم','warn'); return; }
  if (id) { Object.assign(admins.find(x=>x.id===id), data); toast('تم تعديل المشرف'); }
  else { data.id=nextId(admins); data.lastLogin='-'; data.status='active'; admins.push(data); toast('تمت إضافة المشرف'); }
  persist('admins'); closeModal(); renderAdmins(); addLog(id?'تعديل مشرف':'إضافة مشرف', data.name);
}
function deleteAdmin(id) {
  if (!confirm('هل أنت متأكد؟')) return;
  admins = admins.filter(x=>x.id!==id); persist('admins'); renderAdmins();
  toast('تم حذف المشرف','warn');
}

// ── PERMISSIONS ───────────────────────────────────────────────────────────────
function renderPermissions() {
  const roles = ['Super Admin','Admin','Moderator','Support'];
  const perms = ['إدارة المنتجات','إدارة الطلبات','إدارة العملاء','إدارة المدفوعات','إدارة الكوبونات','إدارة المحتوى','عرض التقارير','تصدير التقارير','إدارة المشرفين','إعدادات الموقع','إعدادات الدفع','إعدادات Discord','سجل العمليات'];
  const defaultPerms = {
    'Super Admin': perms.map(()=>true),
    'Admin': [true,true,true,true,true,true,true,true,false,false,false,false,true],
    'Moderator': [true,true,true,false,false,false,true,false,false,false,false,false,false],
    'Support': [false,true,true,false,false,false,false,false,false,false,false,false,false],
  };

  document.getElementById('contentArea').innerHTML = `
    <div class="page-header"><h1 class="page-title">الصلاحيات</h1></div>
    <div class="data-card"><div class="data-table-wrap"><table class="data-table">
      <thead><tr><th>الصلاحية</th>${roles.map(r=>`<th style="text-align:center">${r}</th>`).join('')}</tr></thead>
      <tbody>${perms.map((p,i)=>`<tr><td>${p}</td>${roles.map(r=>`<td style="text-align:center"><input type="checkbox" ${defaultPerms[r][i]?'checked':''} onclick="toast('تم تحديث الصلاحية')"></td>`).join('')}</tr>`).join('')}</tbody>
    </table></div></div>`;
}

// ── LOGS ──────────────────────────────────────────────────────────────────────
function renderLogs() {
  const area = document.getElementById('contentArea');
  area.innerHTML = `
    <div class="page-header"><h1 class="page-title">سجل العمليات</h1></div>
    <div class="data-card"><div class="data-table-wrap"><table class="data-table">
      <thead><tr><th>المشرف</th><th>الإجراء</th><th>التفاصيل</th><th>الوقت</th></tr></thead>
      <tbody>${logs.map(l=>`<tr><td>${l.admin}</td><td>${l.action}</td><td style="color:var(--muted)">${l.details}</td><td>${l.time}</td></tr>`).join('')}</tbody>
    </table></div></div>`;
}

function addLog(action, details) {
  logs.unshift({id:nextId(logs),admin:'Super Admin',action,details,time:new Date().toLocaleString('ar-EG')});
  if (logs.length > 100) logs = logs.slice(0, 100);
  persist('logs');
}
